    <line x1="-15" y1="-10" x2="10" y2="0" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="10" x2="10" y2="0" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="18" y2="-8" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="18" y2="8" stroke="white" stroke-width="3" stroke-linecap="round"/>
